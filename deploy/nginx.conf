# Load balancer: /predict is spread over the replicated "inference" containers,
# everything else (upload, retraining, dashboards) goes to the single "control" container.
worker_processes auto;
events { worker_connections 1024; }

http {
  # Docker's internal DNS. Re-resolved every 5 s so replicas added with --scale are picked up
  # without restarting Nginx; a name with several IPs is balanced round-robin.
  resolver 127.0.0.11 valid=5s ipv6=off;

  client_max_body_size 20m;

  log_format lb '$remote_addr "$request" $status upstream=$upstream_addr '
                'upstream_time=$upstream_response_time total_time=$request_time';
  access_log /var/log/nginx/access.log lb;

  server {
    listen 80;

    location = /predict {
      set $inference http://inference:8000;
      proxy_pass $inference;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_connect_timeout 5s;
      proxy_read_timeout 120s;
    }

    location / {
      set $control http://control:8000;
      proxy_pass $control;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 600s;
    }
  }
}