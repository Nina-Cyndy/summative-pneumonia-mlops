# Start everything:     docker compose up -d --build
# Scale the model API:  docker compose up -d --scale inference=4
# Stop (keep data):     docker compose down        Reset everything: docker compose down -v
name: pneumoscan

# Both API services use the same image, built once (the second build is a cache hit).
x-api-build: &api-build
  context: .
  dockerfile: Dockerfile.api

services:
  # ---- single control-plane instance: uploads, retraining, metrics, dashboards
  control:
    image: pneumoscan-api
    build: *api-build
    restart: unless-stopped
    environment:
      SERVICE_ROLE: control
      LOAD_MODEL_ON_START: "false"
      DB_PATH: /state/app.db
      AUTO_RETRAIN: "true"
      RETRAIN_THRESHOLD: "50"
      RETRAIN_EPOCHS: "5"
    volumes:
      - models:/app/models        # shared with inference: a promoted model reaches every replica
      - uploads:/app/data/uploads
      - state:/state              # SQLite: uploads, retraining runs, serving statistics

  # ---- replicated model API (scale this one)
  inference:
    image: pneumoscan-api
    build: *api-build
    restart: unless-stopped
    environment:
      SERVICE_ROLE: inference
      DB_PATH: /state/app.db
      TF_INTRA_THREADS: "1"       # one CPU thread per replica -> replicas scale fairly
      TF_INTER_THREADS: "1"
    volumes:
      - models:/app/models
      - state:/state
    depends_on:
      control:
        condition: service_healthy

  # ---- Nginx load balancer: the only public entry point for the API (http://localhost:8000)
  lb:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      control:
        condition: service_healthy
      inference:
        condition: service_healthy

  # ---- Streamlit UI (http://localhost:8501)
  ui:
    image: pneumoscan-ui
    build:
      context: .
      dockerfile: Dockerfile.ui
    restart: unless-stopped
    environment:
      API_URL: http://lb
    ports:
      - "8501:8501"
    depends_on:
      - lb

volumes:
  models:
  uploads:
  state: